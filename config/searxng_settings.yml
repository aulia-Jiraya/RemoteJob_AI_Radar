use_default_settings: true

general:
  instance_name: "RemoteJob_AI_Radar_Ephemeral"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "remotejob-ai-radar-ephemeral-local-key-change-if-needed"
  limiter: false
  public_instance: false
  image_proxy: false

engines:
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: qwant
    disabled: false
  - name: google
    disabled: false