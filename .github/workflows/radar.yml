name: RemoteJob AI Radar

on:
  schedule:
    # Jalan otomatis setiap 3 jam (UTC)
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start ephemeral SearXNG container (JSON enabled)
        run: |
          docker run -d \
            --name searxng-radar \
            -p 8080:8080 \
            -v "${{ github.workspace }}/config/searxng_settings.yml:/etc/searxng/settings.yml:ro" \
            searxng/searxng:latest

          echo "Waiting for SearXNG to become ready..."
          for i in $(seq 1 20); do
            if curl -sf "http://localhost:8080/" > /dev/null; then
              echo "SearXNG is ready!"
              break
            fi
            sleep 2
          done

      - name: Run RemoteJob_AI_Radar pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_URL: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          GEMINI_FALLBACK_MODEL: "gemini-3.8-flash"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARXNG_URL: "http://localhost:8080"
        run: python -m src.main

      - name: Stop ephemeral SearXNG container
        if: always()
        run: docker rm -f searxng-radar || true

      - name: Commit and push updated seen_jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/seen_jobs.json; then
            git add data/seen_jobs.json
            git commit -m "chore: update seen_jobs.json [skip ci]"
            git push
          else
            echo "No changes to seen_jobs.json."
          fi
